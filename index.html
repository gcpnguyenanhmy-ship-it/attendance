<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Attendance App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<style>
  :root{
    --bg:#F6F6F3; --ink:#25282B; --muted:#6C7175; --line:#DEDDD7;
    --in:#2F5D7C; --out:#7A705F; --fail:#C0402B; --flash:#E8EEF2;
    --btnIn:#2F5D7C; --btnInText:#FFFFFF; --btnOut:#25282B; --btnOutText:#FFFFFF;
    --cam:#0B0E10;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161819; --ink:#E9E7E2; --muted:#9A9EA1; --line:#2B2E30;
      --in:#86B6D6; --out:#B8AD97; --fail:#E8806B; --flash:#1E2A33;
      --btnIn:#86B6D6; --btnInText:#10212C; --btnOut:#E9E7E2; --btnOutText:#161819;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161819; --ink:#E9E7E2; --muted:#9A9EA1; --line:#2B2E30;
    --in:#86B6D6; --out:#B8AD97; --fail:#E8806B; --flash:#1E2A33;
    --btnIn:#86B6D6; --btnInText:#10212C; --btnOut:#E9E7E2; --btnOutText:#161819;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *,*::before,*::after{box-sizing:inherit}
  [hidden]{display:none !important}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:16px; line-height:1.5; font-weight:400;
    -webkit-user-select:none; user-select:none;
  }
  input{-webkit-user-select:text; user-select:text}
  button{font-family:inherit}

  /* Thanh trên */
  .header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .header .in{
    max-width:640px; margin:0 auto; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
  }
  .title{font-size:15px; letter-spacing:.04em; color:var(--muted); padding-bottom:4px}
  .when{text-align:right}
  .clock{font-size:36px; font-weight:300; line-height:1; letter-spacing:-0.01em; font-variant-numeric:tabular-nums}
  .date{margin-top:4px; font-size:13px; color:var(--muted); text-transform:capitalize}

  /* Danh sách */
  main{max-width:640px; margin:0 auto; padding:8px 20px 150px}
  .note{color:var(--muted); padding:28px 4px; margin:0}
  #list{list-style:none; margin:0; padding:0}
  .row{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:22px 4px; border-bottom:1px solid var(--line);
  }
  .name{font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .st{display:flex; align-items:center; gap:8px; font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums}
  .st::before{content:""; width:8px; height:8px; border-radius:50%; background:currentColor}
  .st.in{color:var(--in)}
  .st.out{color:var(--out)}
  .st.out::before{background:transparent; box-shadow:inset 0 0 0 1.5px currentColor}
  .row.flash{animation:flash 1.8s ease-out}
  @keyframes flash{from{background:var(--flash)} to{background:transparent}}
  .add{
    display:block; margin:32px auto 0; width:44px; height:44px; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:24px; line-height:1; cursor:pointer;
  }

  /* Thanh nút dưới */
  .actions{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:var(--bg); border-top:1px solid var(--line);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .actions .in{max-width:640px; margin:0 auto}
  .actions .btns{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .actNote{margin:0 0 8px; text-align:center; color:var(--muted); font-size:13px}
  .big{
    min-height:56px; border:0; border-radius:6px; cursor:pointer;
    font-size:17px; font-weight:600; letter-spacing:.01em;
  }
  .big.cin{background:var(--btnIn); color:var(--btnInText)}
  .big.cout{background:var(--btnOut); color:var(--btnOutText)}
  .big:disabled{opacity:.35; cursor:not-allowed}

  /* Hộp thoại */
  dialog{
    border:0; border-radius:10px; padding:0; width:min(480px,calc(100vw - 24px));
    max-height:calc(100vh - 24px); overflow:auto; background:var(--bg); color:var(--ink);
  }
  dialog::backdrop{background:rgba(10,12,14,.55)}
  .dlg{padding:24px}
  .dlg h2{margin:0 0 4px; font-size:20px; line-height:1.3; font-weight:600}
  .hint{margin:0 0 16px; color:var(--muted); font-size:14px}
  .frame{position:relative; overflow:hidden; border-radius:6px; background:var(--cam); aspect-ratio:4/3; width:100%}
  .frame video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block}
  .guide{
    position:absolute; left:50%; top:50%; width:46%; height:76%; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(255,255,255,.8);
    box-shadow:0 0 0 999px rgba(10,12,14,.45); pointer-events:none;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{50%{border-color:rgba(255,255,255,.25)}}
  .ghost,.solid{
    min-height:48px; border-radius:6px; cursor:pointer; font-size:16px; font-weight:600; width:100%;
  }
  .ghost{background:transparent; color:var(--ink); border:1px solid var(--ink)}
  .solid{background:var(--ink); color:var(--bg); border:0}
  .quiet{
    background:none; border:0; color:var(--muted); font-size:15px; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px; padding:10px; display:block; margin:8px auto 0;
  }
  #cancel{margin-top:16px}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}

  .res{text-align:center; padding:12px 0 6px}
  .resIcon svg{width:88px; height:88px}
  .res h2{margin-top:14px; font-size:22px}
  .res p{margin:6px 0 0; color:var(--muted); font-size:16px; overflow-wrap:anywhere}
  .res p.stats{margin-top:14px; font-size:12px; line-height:1.5; color:var(--muted); font-variant-numeric:tabular-nums}
  .res p.stats:empty{display:none}
  #resSub{white-space:pre-line}
  #resBtns{margin-top:18px}
  .tick{stroke-dasharray:60; stroke-dashoffset:60; animation:draw .5s .12s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  form.reg{display:grid; gap:4px; margin-top:12px}
  form.reg input{
    width:100%; padding:14px 2px; border:0; border-bottom:1px solid var(--line); border-radius:0;
    background:transparent; color:var(--ink); font:inherit;
  }
  .regMsg{margin:4px 0 8px; min-height:21px; color:var(--fail); font-size:14px}

  button:focus-visible,input:focus-visible{outline:2px solid var(--in); outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    .guide,.row.flash{animation:none}
    .tick{animation:none; stroke-dashoffset:0}
  }
</style>
</head>
<body>

<header class="header">
  <div class="in">
    <div class="title">Attendance App</div>
    <div class="when">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date">&nbsp;</div>
    </div>
  </div>
</header>

<main>
  <p id="listNote" class="note">Loading...</p>
  <ul id="list"></ul>
  <button id="openReg" class="add" type="button" aria-label="Register New Member" title="Register New Member">+</button>
  <button id="bench" class="quiet" type="button" hidden>Run benchmark</button>
</main>

<div class="actions">
  <div class="in">
    <p id="actNote" class="actNote">Loading...</p>
    <div class="btns">
      <button id="btnIn" class="big cin" disabled>Check in</button>
      <button id="btnOut" class="big cout" disabled>Check out</button>
    </div>
  </div>
</div>

<!-- Camera + kết quả -->
<dialog id="scanDlg">
  <div class="dlg">
    <div id="camView">
      <h2 id="camTitle">Check in</h2>
      <p id="camHint" class="hint"></p>
      <div class="frame">
        <video id="v" autoplay muted playsinline></video>
        <div class="guide"></div>
      </div>
      <button id="cancel" class="ghost" type="button">Cancel</button>
    </div>
    <div id="resView" hidden>
      <div id="res" class="res">
        <div id="resIcon" class="resIcon"></div>
        <h2 id="resTitle"></h2>
        <p id="resSub"></p>
        <p id="resStats" class="stats"></p>
      </div>
      <div id="resBtns" class="two">
        <button id="retry" class="solid" type="button">Retry</button>
        <button id="done" class="ghost" type="button">Close</button>
      </div>
    </div>
  </div>
</dialog>

<!-- Đăng ký nhân viên -->
<dialog id="regDlg">
  <div class="dlg">
    <h2>Register</h2>
    <form id="regForm" class="reg" autocomplete="off">
      <input id="pin" type="password" placeholder="Admin password">
      <input id="rid" placeholder="Member ID">
      <input id="rname" placeholder="Name">
      <p id="regMsg" class="regMsg"></p>
      <div class="two">
        <button id="regCancel" class="ghost" type="button">Cancel</button>
        <button class="solid" type="submit">Open camera</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Nhập mã thiết bị (chỉ hỏi lần đầu trên mỗi thiết bị) -->
<dialog id="tokDlg">
  <div class="dlg">
    <h2>Device ID</h2>
    <form id="tokForm" class="reg" autocomplete="off">
      <input id="tokInput" type="password" placeholder="Enter device id">
      <p id="tokMsg" class="regMsg"></p>
      <button class="solid" type="submit">Save</button>
    </form>
  </div>
</dialog>

<script>
/* ===================== CẤU HÌNH ===================== */
// Dán URL web app của Apps Script (dạng https://script.google.com/macros/s/.../exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxsNhqAJFi3AcGmBFHFlpLDeLladtFfSRtbJfJ79rMqPTgZwTbW3PMk51aufgfbwFaA/exec';
// Muốn tự host model: tải thư mục model về cùng chỗ với index.html rồi đổi thành 'model/'
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const THRESHOLD = 0.4;      // nếu báo "Không nhận ra khuôn mặt" nhiều, thử 0.55 - 0.6
const TZ = 'Asia/Ho_Chi_Minh';
// true: hộp thoại kết quả KHÔNG tự đóng để kịp đọc số liệu khi test trên điện thoại. Dùng thật thì đổi thành false.
const DEBUG_STATS = true;
// true: luôn dùng TinyFaceDetector (nhanh hơn nhiều trên tablet/điện thoại). false: dùng SSD khi có WebGL.
const FORCE_TINY = true;
const WARMUP_MS = 300;      // chờ trước lần quét đầu tiên (để camera ổn định phơi sáng/lấy nét). Trước đây: 700
const SCAN_GAP_MS = 100;    // nghỉ giữa hai lần quét khi chấm công. Trước đây: 350
/* ==================================================== */

let employees = [];        // {id, name, desc, status: {type,time} | null}
let ready = false;
let stream = null;
let scanToken = 0;         // đổi số này để hủy các vòng quét đang chạy
let lastAction = null;
let autoClose = null;
let lastStats = '';        // chuỗi số liệu đo của lần quét gần nhất

// Bộ phát hiện mặt: mặc định SSD (chính xác). Nếu thiết bị không có WebGL sẽ tự đổi sang Tiny (nhanh) trong init()
let DET_OPTS = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 });
let DET_NAME = 'ssd';

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const errText = e => String((e && e.message) || e).replace(/^Error:\s*/, '');

/* ---------- Mã thiết bị (token) ---------- */
const TOKEN_KEY = 'chamcong_token';
let memToken = '';
const getToken = () => {
  if (memToken) return memToken;
  try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
};
const setToken = t => { memToken = t; try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} };
const clearToken = () => { memToken = ''; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

function askToken(msg) {
  return new Promise(resolve => {
    $('tokMsg').textContent = msg || '';
    $('tokInput').value = '';
    if (!$('tokDlg').open) $('tokDlg').showModal();
    $('tokForm').onsubmit = ev => {
      ev.preventDefault();
      const v = $('tokInput').value.trim();
      if (!v) return;
      setToken(v);
      $('tokDlg').close();
      resolve();
    };
  });
}
$('tokDlg').addEventListener('cancel', ev => ev.preventDefault());   // không cho đóng bằng phím Esc

/* ---------- Gọi Apps Script ---------- */
async function apiTimed(action, data = {}) {
  const tReq = performance.now();
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // tránh preflight CORS
      body: JSON.stringify({ token: getToken(), action, ...data })
    });
  } catch (e) {
    const err = new Error('Can not connect to the server.');
    err.code = 'NETWORK';
    throw err;
  }
  let j;
  try { j = await res.json(); }
  catch (e) {
    const err = new Error('The server returned an invalid response. Check that the Apps Script web app access is set to "Anyone".');
    err.code = 'NETWORK';
    throw err;
  }
  if (!j.ok) {
    if (j.error === 'UNAUTHORIZED') {
      clearToken();
      const err = new Error('Incorrect Device ID. Please try again');
      err.code = 'UNAUTHORIZED';
      throw err;
    }
    const err = new Error(j.error || 'Unknown error.');
    err.code = 'SERVER';
    throw err;
  }
  // rtMs: tổng thời gian khứ hồi; serverMs: thời gian chạy bên trong Apps Script (backend trả về)
  return { data: j.data, rtMs: Math.round(performance.now() - tReq), serverMs: (typeof j.serverMs === 'number') ? j.serverMs : null };
}
const api = async (action, data) => (await apiTimed(action, data)).data;

/* ---------- Giữ màn hình luôn sáng (cho tablet) ---------- */
async function keepAwake() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});
keepAwake();

/* ---------- Đồng hồ ---------- */
function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
  $('date').textContent = now.toLocaleDateString('en-GB', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
}
setInterval(tick, 1000); tick();

/* ---------- Danh sách ---------- */
function render(flashId) {
  const ul = $('list');
  ul.textContent = '';
  employees.forEach(e => {
    const li = document.createElement('li');
    li.className = 'row' + (e.id === flashId ? ' flash' : '');

    const nm = document.createElement('span');
    nm.className = 'name'; nm.textContent = e.name;
    li.appendChild(nm);

    if (e.status) {
      const st = document.createElement('span');
      const isIn = e.status.type === 'IN';
      st.className = 'st ' + (isIn ? 'in' : 'out');
      st.textContent = (isIn ? 'In ' : 'Out ') + e.status.time.slice(0, 5);
      li.appendChild(st);
    }
    ul.appendChild(li);
  });
  $('listNote').hidden = employees.length > 0;
  if (!employees.length) $('listNote').textContent = 'No members yet.';
}
function applyStatuses(map) {
  employees.forEach(e => e.status = map[e.id] || null);
  applyPending();
  render();
}
// Dữ liệu khuôn mặt có thể là 1 vector (dạng cũ) hoặc nhiều vector (dạng mới, mỗi góc mặt một vector)
const parseDescs = s => {
  const a = JSON.parse(s);
  return (Array.isArray(a[0]) ? a : [a]).map(v => new Float32Array(v));
};
async function loadData() {
  const list = await api('getEmployees');
  employees = list.map(e => ({
    id: e.id, name: e.name, status: e.status,
    descs: parseDescs(e.desc)
  }));
  applyPending();   // giữ lại trạng thái tạm của các lần chấm công chưa kịp đồng bộ
}

/* ---------- Camera ---------- */
const videoReady = v => v.readyState >= 2 && v.videoWidth > 0;

async function startCamera() {
  stopCamera();
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  });
  const v = $('v');
  v.srcObject = stream;
  // đợi tới khi có khung hình thật (tối đa 5 giây)
  await Promise.race([
    new Promise(res => { if (videoReady(v)) res(); else v.onloadeddata = () => res(); }),
    sleep(5000)
  ]);
  try { await v.play(); } catch (e) {}
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('v').srcObject = null;
}
const cameraReason = () => window.isSecureContext
  ? 'Unable to start the camera. Please allow camera access.'
  : 'This page must be served over HTTPS to use the camera.';

/* ---------- Hộp thoại quét ---------- */
function openScan(title, hint) {
  clearTimeout(autoClose);
  lastStats = '';
  $('camTitle').textContent = title;
  $('camHint').textContent = hint;
  $('camView').hidden = false;
  $('resView').hidden = true;
  if (!$('scanDlg').open) $('scanDlg').showModal();
}
function closeScan() { if ($('scanDlg').open) $('scanDlg').close(); }
$('scanDlg').addEventListener('close', () => {
  scanToken++; clearTimeout(autoClose); stopCamera();
});
$('cancel').addEventListener('click', closeScan);
$('done').addEventListener('click', closeScan);
$('retry').addEventListener('click', () => lastAction && lastAction());

const ICON_OK = c => `<svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="41" fill="none" stroke="var(--${c})" stroke-width="2.5"/><path class="tick" d="M27 46 L39 58 L62 32" fill="none" stroke="var(--${c})" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_FAIL = `<svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="41" fill="none" stroke="var(--fail)" stroke-width="2.5"/><path class="tick" d="M30 30 L58 58 M58 30 L30 58" fill="none" stroke="var(--fail)" stroke-width="4" stroke-linecap="round"/></svg>`;

function showResult(r) {      // r = {ok, kind: 'in'|'out', title, sub}
  stopCamera();
  $('camView').hidden = true;
  $('resView').hidden = false;
  $('res').className = 'res ' + (r.ok ? r.kind : 'fail');
  $('resIcon').innerHTML = r.ok ? ICON_OK(r.kind) : ICON_FAIL;
  $('resTitle').textContent = r.title;
  $('resSub').textContent = r.sub;
  $('resStats').textContent = lastStats;
  $('retry').hidden = r.ok;
  $('resBtns').style.gridTemplateColumns = r.ok ? '1fr' : '1fr 1fr';
  $('done').className = r.ok ? 'quiet' : 'ghost';
  $('done').textContent = 'Close';
  clearTimeout(autoClose);
  if (r.ok && !DEBUG_STATS) autoClose = setTimeout(closeScan, 2600);
}

/* ---------- Nhận diện ---------- */
async function detectFull() {          // trả về { descriptor, landmarks, ... } hoặc null
  const v = $('v');
  if (!videoReady(v)) return null;
  const r = await faceapi.detectSingleFace(v, DET_OPTS).withFaceLandmarks().withFaceDescriptor();
  return r || null;
}
async function getDescriptor() {
  const r = await detectFull();
  return r ? r.descriptor : null;
}
// Trả về người gần nhất và khoảng cách tới họ (dù có vượt THRESHOLD hay không)
function bestMatch(d) {
  let best = null, bestDist = 9;
  employees.forEach(e => {
    // khoảng cách tới một nhân viên = góc mặt gần nhất trong các mẫu đã lưu
    let dist = 9;
    e.descs.forEach(v => { const x = faceapi.euclideanDistance(d, v); if (x < dist) dist = x; });
    if (dist < bestDist) { bestDist = dist; best = e; }
  });
  return { emp: best, dist: bestDist };
}
function matchEmployee(d) {
  const m = bestMatch(d);
  return m.dist <= THRESHOLD ? m.emp : null;
}
// Thử nhận diện tối đa 10 giây; cần khớp cùng một người 2 lần liên tiếp mới chấp nhận
// Tổng hợp số liệu đo được của một phiên quét
function finishStats(S, t0, outcome) {
  const now = performance.now();
  const lat = S.lat;
  const sum = lat.reduce((a, b) => a + b, 0);
  const st = {
    outcome,                                        // 'matched' | 'unknown' | 'noface'
    backend: faceapi.tf.getBackend(),
    totalMs: Math.round(now - t0),                  // tổng thời gian từ lúc bắt đầu quét
    attempts: S.attempts,                           // số lần quét
    facesFound: S.faces,                            // số lần quét thấy mặt
    firstFaceMs: S.firstFaceMs === null ? null : Math.round(S.firstFaceMs),   // lúc thấy mặt đầu tiên
    matchMs: S.matchMs === null ? null : Math.round(S.matchMs),               // lúc nhận ra người
    avgLatMs: lat.length ? Math.round(sum / lat.length) : 0,                  // độ trễ trung bình 1 lần quét
    minLatMs: lat.length ? Math.round(Math.min(...lat)) : 0,
    maxLatMs: lat.length ? Math.round(Math.max(...lat)) : 0,
    scansPerSec: +(S.attempts / ((now - t0) / 1000)).toFixed(2),
    minDist: S.minDist === null ? null : +S.minDist.toFixed(3),   // khoảng cách nhỏ nhất đo được (so với THRESHOLD)
    minName: S.minName,
    threshold: THRESHOLD,
    dists: S.dists,
    detector: DET_NAME,
    // "1: 874ms / 0.47; 2: 752ms / -; ..." (mỗi lần quét: độ trễ / khoảng cách)
    scansDetail: lat.map((ms, i) => `${i + 1}: ${Math.round(ms)}ms / ${S.dists[i] === null ? '-' : S.dists[i]}`).join('; ')
  };
  console.log('SCAN STATS', st);
  console.table(lat.map((ms, i) => ({ scan: i + 1, detectMs: Math.round(ms), faceFound: S.hit[i] ? 'yes' : 'no', distance: S.dists[i] })));
  return st;
}
function fmtStats(s, T) {
  if (!s) return '';
  const f = v => v === null ? '-' : v + 'ms';
  return `Scans: ${s.attempts} (${s.facesFound} with face) / ${s.totalMs}ms · ` +
    `avg latency ${s.avgLatMs}ms (${s.minLatMs}-${s.maxLatMs}) · ${s.scansPerSec}/s · ` +
    `first face at ${f(s.firstFaceMs)} · matched at ${f(s.matchMs)} · ` +
    `closest distance ${s.minDist === null ? '-' : s.minDist + (s.minName ? ' (' + s.minName + ')' : '')} / threshold ${s.threshold} · ` +
    `${s.backend}/${s.detector} · per scan: ${s.dists.map(x => x === null ? '-' : x).join(', ')}` +
    (T ? ` · camera ${T.camMs}ms` +
         (T.logRtMs != null ? ` · logCheck ${T.logRtMs}ms (server ${T.logServerMs == null ? '-' : T.logServerMs + 'ms'})` : '') +
         ` · total ${T.totalUiMs}ms` : '');
}

// Gửi số liệu quét về Apps Script để ghi vào tab Metrics (không chặn giao diện, lỗi thì bỏ qua)
function sendMetrics(type, res, T) {
  const s = res && res.stats;
  if (!s) return;
  const emp = res.emp || null;
  api('logMetrics', {
    type,                                   // IN | OUT
    outcome: s.outcome,                     // matched | unknown | noface
    id: emp ? emp.id : '',
    name: emp ? emp.name : '',
    nearest: s.minName || '',               // người gần nhất (kể cả khi không khớp)
    totalMs: s.totalMs,
    attempts: s.attempts,
    facesFound: s.facesFound,
    avgLatMs: s.avgLatMs,
    minLatMs: s.minLatMs,
    maxLatMs: s.maxLatMs,
    firstFaceMs: s.firstFaceMs,
    matchMs: s.matchMs,
    minDist: s.minDist,
    threshold: s.threshold,
    scansDetail: s.scansDetail,
    backend: s.backend,
    detector: s.detector,
    device: (navigator.userAgent || '').slice(0, 120),
    camMs: T ? T.camMs : null,                 // thời gian mở camera
    logRtMs: T ? T.logRtMs : null,             // logCheck: tổng thời gian khứ hồi
    logServerMs: T ? T.logServerMs : null,     // logCheck: thời gian chạy trong Apps Script
    totalUiMs: T ? T.totalUiMs : null          // từ lúc bấm nút đến lúc có kết quả
  }).catch(e => console.warn('logMetrics failed:', errText(e)));
}

async function recognise(token) {
  const t0 = performance.now();
  const S = { attempts: 0, faces: 0, lat: [], hit: [], firstFaceMs: null, matchMs: null, dists: [], minDist: null, minName: '' };
  let seenFace = false, streakId = null, streak = 0;
  await sleep(WARMUP_MS);
  while (performance.now() - t0 < 10000) {
    if (token !== scanToken) return { cancelled: true };

    const a0 = performance.now();
    const d = await getDescriptor();
    S.lat.push(performance.now() - a0);       // độ trễ của riêng lần quét này
    S.attempts++;
    S.hit.push(!!d);
    S.dists.push(null);                        // khoảng cách của lần quét này (null nếu không thấy mặt)

    if (d) {
      seenFace = true;
      S.faces++;
      if (S.firstFaceMs === null) S.firstFaceMs = performance.now() - t0;
      const m = bestMatch(d);
      S.dists[S.dists.length - 1] = +m.dist.toFixed(3);
      if (S.minDist === null || m.dist < S.minDist) { S.minDist = m.dist; S.minName = m.emp ? m.emp.name : ''; }
      const emp = m.dist <= THRESHOLD ? m.emp : null;
      if (emp) {
        streak = (emp.id === streakId) ? streak + 1 : 1;
        streakId = emp.id;
        if (streak >= 2) {
          S.matchMs = performance.now() - t0;
          return { emp, stats: finishStats(S, t0, 'matched') };
        }
      } else { streak = 0; streakId = null; }
    }
    await sleep(SCAN_GAP_MS);
  }
  const outcome = seenFace ? 'unknown' : 'noface';
  return { error: outcome, stats: finishStats(S, t0, outcome) };
}
const REASON = {
  noface: 'No face detected.',
  unknown: 'Face not registered.'
};

/* ---------- Check in / Check out ---------- */
async function doCheck(type) {
  const label = type === 'IN' ? 'Check in' : 'Check out';
  const token = ++scanToken;
  const tBtn = performance.now();               // mốc bắt đầu: lúc bấm nút
  lastAction = () => doCheck(type);
  openScan(label, 'Look straight at the camera.');

  try {
    await startCamera();
    if (token !== scanToken) return stopCamera();
  } catch (e) {
    return showResult({ ok: false, title: label + ' Fail', sub: cameraReason() });
  }
  const camMs = Math.round(performance.now() - tBtn);   // thời gian mở camera

  try {
    const res = await recognise(token);
    if (res.cancelled || token !== scanToken) return;
    if (res.error) {
      const T = { camMs, totalUiMs: Math.round(performance.now() - tBtn) };
      lastStats = fmtStats(res.stats, T);
      sendMetrics(type, res, T);
      return showResult({ ok: false, title: label + ' Fail', sub: REASON[res.error] });
    }

    // Không chờ máy chủ: kiểm tra nhanh bằng trạng thái đã tải, hiện kết quả ngay, rồi ghi nhận ở nền.
    // Máy chủ vẫn là nơi quyết định cuối cùng; nếu khác kết quả đã hiện thì báo muộn (xem applyServerResult).
    const T = { camMs, totalUiMs: Math.round(performance.now() - tBtn) };
    lastStats = fmtStats(res.stats, T);
    const known = employees.find(x => x.id === res.emp.id);
    const st = known && known.status;
    if (st && st.type === type) {                      // trùng loại với lần gần nhất hôm nay
      sendMetrics(type, res, T);
      return handleLog(res.emp, type, label, { status: 'SAME', time: st.time });
    }
    if (!st && type === 'OUT') {                       // check out khi hôm nay chưa check in
      sendMetrics(type, res, T);
      return handleLog(res.emp, type, label, { status: 'NO_IN' });
    }
    handleLog(res.emp, type, label, { status: 'OK', time: localTime(Date.now()) });
    enqueueCheck(res.emp, type, { type, res, T });
  } catch (e) {
    showResult({ ok: false, title: label + ' Fail', sub: errText(e) });
  }
}

function handleLog(emp, type, label, r) {
  const done = type === 'IN' ? 'checked in' : 'checked out';
  const fail = sub => showResult({ ok: false, title: label + ' Fail', sub });
  if (r.status === 'OK') {
    const e = employees.find(x => x.id === emp.id);
    if (e) e.status = { type, time: r.time };
    render(emp.id);
    return showResult({ ok: true, kind: type === 'IN' ? 'in' : 'out', title: label + ' Success', sub: emp.name + ' · ' + r.time });
  }
  if (r.status === 'SAME')    return fail(`${emp.name} already ${done} at ${r.time}.`);
  if (r.status === 'NO_IN')   return fail(`${emp.name} has not checked in today.`);
  if (r.status === 'UNKNOWN') return fail('Member not found in the list.');
  fail('Unable to record the attendance.');
}

$('btnIn').addEventListener('click', () => doCheck('IN'));
$('btnOut').addEventListener('click', () => doCheck('OUT'));

/* ---------- Đăng ký nhiều góc mặt ---------- */
const FRONT_SAMPLES = 4;        // số mẫu khi nhìn thẳng (góc dùng nhiều nhất nên lấy nhiều hơn)
const SIDE_SAMPLES = 2;         // số mẫu mỗi bên trái / phải. Tổng vector = FRONT + 2 x SIDE, không vượt giới hạn của backend (hiện 15)
const POSE_TIMEOUT = 20000;     // thời gian tối đa cho mỗi góc (ms)
const YAW_FRONT = 0.06;         // lệch tối đa khi nhìn thẳng
const YAW_SIDE_MIN = 0.10;      // lệch tối thiểu khi xoay trái/phải (nhỏ hơn: coi như chưa xoay đủ)
const YAW_SIDE_MAX = 0.30;      // lệch tối đa (xoay quá nhiều thì mẫu không dùng được)
const FLIP_YAW = false;         // nếu thấy hướng trái/phải bị ngược, đổi thành true

// Ước lượng độ xoay ngang từ 68 điểm mốc: so vị trí đầu mũi (điểm 30) với hai đầu đường hàm (điểm 0 và 16).
// Giá trị dương = mặt quay sang TRÁI màn hình (màn hình đang lật gương), âm = sang PHẢI, gần 0 = nhìn thẳng.
function yawOf(landmarks) {
  const p = landmarks.positions;
  const w = p[16].x - p[0].x;
  if (!w) return 0;
  const r = (p[30].x - p[0].x) / w;          // khoảng 0.5 khi nhìn thẳng
  return (FLIP_YAW ? -1 : 1) * (r - 0.5);
}

const POSES = [
  { name: 'Front', count: FRONT_SAMPLES, hint: 'Look straight at the camera and hold still.', ok: y => Math.abs(y) <= YAW_FRONT },
  { name: 'Left',  count: SIDE_SAMPLES, hint: 'Turn your head slightly to the LEFT (toward the left of the screen).', ok: y => y >= YAW_SIDE_MIN && y <= YAW_SIDE_MAX },
  { name: 'Right', count: SIDE_SAMPLES, hint: 'Turn your head slightly to the RIGHT (toward the right of the screen).', ok: y => y <= -YAW_SIDE_MIN && y >= -YAW_SIDE_MAX }
];

// Trả về { samples } (mỗi mẫu là 1 vector 128 chiều), hoặc { cancelled }, hoặc { error: 'thông báo' }
async function capturePoses(token) {
  const samples = [];
  await sleep(700);
  for (let i = 0; i < POSES.length; i++) {
    const pose = POSES[i];
    const label = `Step ${i + 1}/${POSES.length}: ${pose.hint}`;
    let got = 0;
    const t0 = Date.now();
    $('camHint').textContent = label;
    while (got < pose.count && Date.now() - t0 < POSE_TIMEOUT) {
      if (token !== scanToken) return { cancelled: true };
      const r = await detectFull();
      if (r) {
        const y = yawOf(r.landmarks);
        console.log(`[register] ${pose.name}: yaw=${y.toFixed(3)}`);   // xem số này để chỉnh YAW_* nếu cần
        if (pose.ok(y)) {
          samples.push(r.descriptor);
          got++;
          $('camHint').textContent = `${label} (${got}/${pose.count})`;
          await sleep(500);
          continue;
        }
      }
      await sleep(250);
    }
    if (got < pose.count) {
      return { error: `Could not capture the "${pose.name}" angle. Turn slightly in the right direction and try again.` };
    }
    if (i < POSES.length - 1) {
      $('camHint').textContent = 'Good. Get ready for the next step...';
      await sleep(900);
    }
  }
  return { samples };
}

async function doRegister(id, name, pin) {
  const token = ++scanToken;
  lastAction = () => doRegister(id, name, pin);
  openScan('Register', 'Look straight at the camera and hold still.');

  try {
    await startCamera();
    if (token !== scanToken) return stopCamera();
  } catch (e) {
    return showResult({ ok: false, title: 'Registration Fail', sub: cameraReason() });
  }

  try {
    const cap = await capturePoses(token);
    if (cap.cancelled || token !== scanToken) return;
    if (cap.error) return showResult({ ok: false, title: 'Registration Fail', sub: cap.error });

    // Lưu TỪNG vector riêng (làm tròn 4 chữ số cho gọn ô Sheet), không lấy trung bình
    const vecs = cap.samples.map(s => Array.from(s, v => +v.toFixed(4)));
    await api('registerEmployee', { id, name, descJson: JSON.stringify(vecs), pin });
    employees.push({ id, name, descs: vecs.map(v => new Float32Array(v)), status: null });

    $('regForm').reset();
    render(id);
    showResult({ ok: true, kind: 'in', title: 'Registered', sub: name });
  } catch (e) {
    showResult({ ok: false, title: 'Registration Fail', sub: errText(e) });
  }
}

/* ---------- Hàng đợi ghi nhận ở nền (optimistic UI) ---------- */
const QUEUE_KEY = 'chamcong_queue';
const MAX_AGE_MS = 12 * 3600 * 1000;     // bỏ bản ghi chờ quá 12 giờ
let syncQueue = loadQueue();
let syncRunning = false;
let noticeTimer = null, warnUntil = 0;

function loadQueue() {
  try {
    const a = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
    return a.filter(x => x && x.id && (x.type === 'IN' || x.type === 'OUT') && Date.now() - x.ts < MAX_AGE_MS);
  } catch (e) { return []; }
}
function saveQueue() {      // lưu vào máy để không mất khi tải lại trang (bỏ phần số liệu đo _m)
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(syncQueue.map(({ id, name, type, ts, tries }) => ({ id, name, type, ts, tries })))); } catch (e) {}
}

const localTime = ms => new Date(ms).toLocaleTimeString('en-GB', { timeZone: TZ, hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const secsOf = s => { const p = String(s || '').split(':').map(Number); return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0); };

// Dòng thông báo nhỏ phía trên nút Check in/out
function notice(text, opt) {
  opt = opt || {};
  const el = $('actNote');
  clearTimeout(noticeTimer);
  el.hidden = !text;
  el.textContent = text || '';
  el.style.color = opt.warn ? 'var(--fail)' : '';
  if (opt.warn) warnUntil = opt.sticky ? Infinity : Date.now() + 10000;
  if (text && !opt.sticky) noticeTimer = setTimeout(updateSyncNotice, 10000);
}
function updateSyncNotice() {
  if (Date.now() < warnUntil) return;      // đang hiện cảnh báo thì không ghi đè
  const slow = syncQueue.length > 1 || (syncQueue[0] && syncQueue[0].tries > 0);
  notice(slow ? `Syncing ${syncQueue.length} record(s)...` : '', { sticky: true });
}

// Đặt lại trạng thái tạm (lần chấm công đã hiện thành công nhưng chưa được máy chủ xác nhận)
function applyPending() {
  syncQueue.forEach(it => {
    const e = employees.find(x => x.id === it.id);
    if (e) e.status = { type: it.type, time: localTime(it.ts) };
  });
}
async function refreshStatuses() {
  try { applyStatuses(await api('getStatuses')); } catch (e) {}
}

function enqueueCheck(emp, type, metricsCtx) {
  syncQueue.push({ id: emp.id, name: emp.name, type, ts: Date.now(), tries: 0, _m: metricsCtx });
  saveQueue();
  processQueue();
}

async function processQueue() {
  if (syncRunning) return;
  syncRunning = true;
  try {
    while (syncQueue.length) {
      const item = syncQueue[0];
      updateSyncNotice();
      let call;
      try {
        call = await apiTimed('logCheck', { id: item.id, type: item.type, ts: item.ts });
      } catch (e) {
        if (e.code === 'UNAUTHORIZED') {
          notice('Device ID is no longer valid. Reload the page to enter it again. Pending records are kept.', { warn: true, sticky: true });
          return;
        }
        item.tries = (item.tries || 0) + 1;
        const limit = e.code === 'SERVER' ? 3 : 20;       // lỗi mạng thử nhiều lần hơn lỗi do máy chủ trả về
        if (item.tries >= limit) {
          syncQueue.shift(); saveQueue();
          notice(`${item.name}: ${item.type === 'IN' ? 'check in' : 'check out'} could not be recorded (${errText(e)}). Please try again.`, { warn: true });
          await refreshStatuses();                       // trả trạng thái về đúng như máy chủ
          continue;
        }
        saveQueue();
        await sleep(Math.min(30000, 2000 * Math.pow(2, item.tries - 1)));
        continue;
      }
      syncQueue.shift(); saveQueue();
      applyServerResult(item, call);
    }
  } finally {
    syncRunning = false;
    updateSyncNotice();
  }
}

// Máy chủ trả kết quả thật cho một lần chấm công đã hiện thành công trước đó
function applyServerResult(item, call) {
  const r = call.data || {};
  const verb = item.type === 'IN' ? 'check in' : 'check out';
  const e = employees.find(x => x.id === item.id);

  if (r.status === 'OK') {
    if (e) e.status = { type: item.type, time: r.time };       // giờ chính thức do máy chủ ghi
    render();
  } else if (r.status === 'SAME') {
    // Đã có bản ghi cùng loại. Nếu giờ trùng khoảng giờ quét thì coi như lần gửi trước đã thành công (chỉ mất phản hồi).
    if (e && r.time) e.status = { type: item.type, time: r.time };
    render();
    if (Math.abs(secsOf(r.time) - secsOf(localTime(item.ts))) > 90) {
      notice(`${item.name}: already ${item.type === 'IN' ? 'checked in' : 'checked out'} at ${r.time}. This scan was not added.`, { warn: true });
    }
  } else {
    const why = r.status === 'NO_IN' ? 'has not checked in today' : 'was not found in the list';
    notice(`${item.name}: ${verb} was NOT recorded (${why}).`, { warn: true });
    refreshStatuses();
  }

  // Gửi số liệu đo, kèm thời gian logCheck thật
  if (item._m) sendMetrics(item._m.type, item._m.res, Object.assign({}, item._m.T, { logRtMs: call.rtMs, logServerMs: call.serverMs }));
}
window.addEventListener('online', processQueue);

/* ---------- Benchmark: đo riêng từng khâu (chỉ hiện nút khi DEBUG_STATS = true) ---------- */
const avgOf = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0;

async function runBenchmark() {
  const token = ++scanToken;
  lastAction = runBenchmark;
  openScan('Benchmark', 'Look straight at the camera. Measuring...');

  const tCam = performance.now();
  try {
    await startCamera();
    if (token !== scanToken) return stopCamera();
  } catch (e) {
    return showResult({ ok: false, title: 'Benchmark Fail', sub: cameraReason() });
  }
  const camMs = Math.round(performance.now() - tCam);

  try {
    await sleep(WARMUP_MS);
    const v = $('v');
    await detectFull();                          // chạy 1 lần để làm nóng (lần đầu thường chậm do biên dịch shader WebGL)

    // Mỗi vòng chạy 3 chuỗi: [phát hiện], [phát hiện + điểm mốc], [phát hiện + điểm mốc + vector]
    // rồi lấy hiệu để suy ra thời gian của từng bước.
    const T = { det: [], lmk: [], full: [] };
    for (let tries = 0; tries < 20 && T.det.length < 6; tries++) {
      if (token !== scanToken) return;
      let a = performance.now();
      const r1 = await faceapi.detectSingleFace(v, DET_OPTS);
      const dDet = performance.now() - a;
      if (!r1) { await sleep(200); continue; }

      a = performance.now();
      await faceapi.detectSingleFace(v, DET_OPTS).withFaceLandmarks();
      const dLmk = performance.now() - a;

      a = performance.now();
      await faceapi.detectSingleFace(v, DET_OPTS).withFaceLandmarks().withFaceDescriptor();
      const dFull = performance.now() - a;

      T.det.push(dDet); T.lmk.push(dLmk); T.full.push(dFull);
    }
    if (T.det.length < 3) return showResult({ ok: false, title: 'Benchmark Fail', sub: REASON.noface });

    const det = avgOf(T.det);
    const lmk = Math.max(0, avgOf(T.lmk) - det);
    const desc = Math.max(0, avgOf(T.full) - avgOf(T.lmk));

    // Apps Script: gọi 3 lần mỗi loại để thấy lần đầu (có thể bị "nguội") so với các lần sau
    const ping = [], stat = [], dry = [];
    for (let i = 0; i < 3; i++) ping.push(await apiTimed('ping'));
    for (let i = 0; i < 3; i++) stat.push(await apiTimed('getStatuses'));
    // Chạy y hệt đường đi của check in thật nhưng KHÔNG ghi vào Sheet (dry: true)
    const emp0 = employees[0];
    for (let i = 0; i < 3; i++) dry.push(await apiTimed('logCheck', { id: emp0 ? emp0.id : '', type: 'IN', dry: true }));
    const all = await apiTimed('getEmployees');        // lệnh nặng nhất, chạy khi mở trang
    if (token !== scanToken) return;
    const stp = (dry[dry.length - 1].data && dry[dry.length - 1].data.t) || {};
    const step = k => stp[k] == null ? '-' : stp[k];
    const fmtCalls = c => `${c.map(x => x.rtMs).join(', ')} ms  |  server: ${c.map(x => x.serverMs == null ? '-' : x.serverMs).join(', ')} ms`;

    const lines = [
      `Camera open: ${camMs} ms`,
      `Face detection (${DET_NAME}): ${det} ms`,
      `Landmarks (68 points): ${lmk} ms`,
      `Descriptor (128 values): ${desc} ms`,
      `Total per scan: ${avgOf(T.full)} ms  (${T.det.length} runs, ${faceapi.tf.getBackend()})`,
      `Ping round trip: ${fmtCalls(ping)}`,
      `getStatuses round trip: ${fmtCalls(stat)}`,
      `logCheck (dry run, no write) round trip: ${fmtCalls(dry)}`,
      `  server steps: find member ${step('findMs')} ms · lock ${step('lockMs')} ms · read Log ${step('readMs')} ms`,
      `getEmployees round trip: ${all.rtMs} ms  |  server: ${all.serverMs == null ? '-' : all.serverMs} ms`,
      `Note: a real check in also appends one row to the Log sheet (not included in the dry run).`
    ];
    console.log('BENCHMARK\n' + lines.join('\n'));
    showResult({ ok: true, kind: 'in', title: 'Benchmark', sub: lines.join('\n') });
  } catch (e) {
    showResult({ ok: false, title: 'Benchmark Fail', sub: errText(e) });
  }
}
$('bench').addEventListener('click', runBenchmark);

/* ---------- Khởi động ---------- */
async function init() {
  if (!API_URL || API_URL.indexOf('DAN_URL') === 0) {
    throw new Error('API_URL is not set in index.html.');
  }

  let msg = '';
  for (;;) {
    if (!getToken()) await askToken(msg);
    try { await loadData(); break; }
    catch (e) {
      if (e.code === 'UNAUTHORIZED') { msg = 'Incorrect Device ID.'; continue; }
      throw e;
    }
  }
  render();

  await faceapi.tf.ready();
  const backend = faceapi.tf.getBackend();
  console.log('TF backend:', backend);          // nên là "webgl"

  if (backend === 'webgl' && !FORCE_TINY) {
    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
  } else {
    // Không có WebGL: dùng bộ phát hiện nhẹ để quét kịp trong 10 giây
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    DET_OPTS = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.7 });
    DET_NAME = 'tiny';
  }
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  ready = true;

  $('btnIn').disabled = false;
  $('btnOut').disabled = false;
  $('actNote').hidden = true;
  if (DEBUG_STATS) $('bench').hidden = false;
  processQueue();      // gửi các bản ghi còn tồn từ lần trước (nếu có)

  // Mỗi 60 giây cập nhật trạng thái; mỗi 10 phút tải lại cả danh sách (nhận người mới đăng ký ở thiết bị khác)
  let n = 0;
  setInterval(async () => {
    if (!ready || $('scanDlg').open || $('regDlg').open || $('tokDlg').open) return;
    try {
      n++;
      if (n % 10 === 0) { await loadData(); render(); }
      else applyStatuses(await api('getStatuses'));
    } catch (e) {}
  }, 60000);
}
init().catch(e => {
  $('listNote').hidden = false;
  $('listNote').textContent = 'Failed to load data: ' + errText(e);
  $('actNote').textContent = 'Reload the page to try again.';
});
</script>
