<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Attendance App</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
    <link rel="stylesheet" href="Style.css?v=1" />
  </head>
  <body>
    <header class="header">
      <div class="in">
        <div class="title">Attendance Clock</div>
        <div class="hdrRight">
          <div class="when">
            <div id="clock" class="clock">--:--:--</div>
            <div id="date" class="date">&nbsp;</div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2 class="label">1. Members</h2>
        <p id="listNote" class="note">Loading...</p>
        <ul id="list"></ul>
      </section>

      <section class="panel">
        <h2 class="label">2. Clock action</h2>
        <div class="btns">
          <button id="btnIn" class="big" disabled>Clock in</button>
          <button id="btnOut" class="big" disabled>Clock out</button>
        </div>
        <p id="actNote" class="actNote">Loading...</p>
      </section>
    </main>

    <!-- Camera + kết quả -->
    <dialog id="scanDlg">
      <div class="dlg">
        <div id="camView">
          <h2 id="camTitle">Check in</h2>
          <p id="camHint" class="hint"></p>
          <div class="frame">
            <video id="v" autoplay muted playsinline></video>
            <div class="guide"></div>
          </div>
          <button id="cancel" class="ghost" type="button">Cancel</button>
        </div>
        <div id="resView" hidden>
          <div id="res" class="res">
            <div id="resIcon" class="resIcon"></div>
            <h2 id="resTitle"></h2>
            <p id="resSub"></p>
          </div>
          <div id="resBtns" class="two">
            <button id="retry" class="solid" type="button">Retry</button>
            <button id="done" class="ghost" type="button">Close</button>
          </div>
        </div>
      </div>
    </dialog>

    <!-- Chấm công bằng PIN -->
    <dialog id="pinDlg">
      <div class="dlg">
        <div class="pcTop">
          <button
            id="pcFace"
            class="pcIcon"
            type="button"
            disabled
            aria-label="Register / change face"
            title="Register / change face"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18.469 11.197A8 8 0 1 0 11.197 18.469" />
              <path d="M8 9h.01" />
              <path d="M13 9h.01" />
              <path d="M7.8 12.6c.7 1.2 1.7 1.8 2.7 1.8s2 -.6 2.7 -1.8" />
              <g transform="translate(11.5 11.5) scale(0.55)" stroke-width="3.3">
                <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
                <path d="M13.5 6.5l4 4" />
              </g>
            </svg>
          </button>
          <h2 class="pcTitle">Enter PIN</h2>
          <button id="pcClose" class="pcIcon" type="button" aria-label="Close">
            &times;
          </button>
        </div>
        <p id="pcSub" class="pcSub"></p>
        <div id="pcDots" class="dots">
          <span></span><span></span><span></span><span></span>
        </div>
        <p id="pcMsg" class="hint"></p>
        <div id="pcKeys" class="keys"></div>
        <div class="two pcFoot">
          <button id="pcIn" class="act in" type="button" disabled>
            Clock in
          </button>
          <button id="pcOut" class="act out" type="button" disabled>
            Clock out
          </button>
        </div>
      </div>
    </dialog>

    <!-- Xác nhận ghi đè khuôn mặt -->
    <dialog id="ovwDlg">
      <div class="dlg">
        <h2>Overwrite face?</h2>
        <p id="ovwText" class="hint"></p>
        <div class="two">
          <button id="ovwNo" class="ghost" type="button">Cancel</button>
          <button id="ovwYes" class="solid" type="button">Overwrite</button>
        </div>
      </div>
    </dialog>

    <!-- Nhập mã thiết bị (chỉ hỏi lần đầu trên mỗi thiết bị) -->
    <dialog id="tokDlg">
      <div class="dlg">
        <h2>Device ID</h2>
        <form id="tokForm" class="reg" autocomplete="off">
          <input id="tokInput" type="password" placeholder="Enter device id" />
          <p id="tokMsg" class="regMsg"></p>
          <button class="solid" type="submit">Save</button>
        </form>
      </div>
    </dialog>

    <script src="Script.js?v=1"></script>
  </body>
</html>
